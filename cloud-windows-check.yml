name: Cloud Windows release verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloud-windows-check.yml'
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Download and verify released installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'AtraSetup.exe'
          curl.exe --fail --location --retry 3 --output $setup 'https://github.com/ataturukmen420/atra/releases/download/v1.0.1/AtraSetup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          if ($actual -ne '251aa5a20f4f723f6564d4f4ac31e183a7c3bb6f9b9b2246f2620d89ec65e8d4') { throw "Installer hash mismatch: $actual" }
          Write-Host 'Release installer SHA-256 verified.'
      - name: Test clean and locked-file installations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'atra-cloud-install'
          $data = Join-Path $env:RUNNER_TEMP 'atra-cloud-data'
          $setup = Join-Path $env:RUNNER_TEMP 'AtraSetup.exe'
          New-Item -ItemType Directory -Path $root,$data -Force | Out-Null
          '{"translation_engine":"google"}' | Set-Content -Encoding utf8 (Join-Path $data 'config.json')
          $env:ATRA_DATA_DIR = $data
          $legacy = Join-Path $root 'Atra.exe'
          [IO.File]::WriteAllText($legacy, 'locked legacy test file')
          (Get-Item -LiteralPath $legacy).IsReadOnly = $true
          $original = (Get-FileHash -LiteralPath $legacy).Hash
          $file = [IO.File]::Open($legacy, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::None)
          $atra = $null
          try {
            $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=$root")
            $first = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($first.ExitCode -ne 0) { throw "First installation failed: $($first.ExitCode)" }
            $dirs = @(Get-ChildItem -LiteralPath $root -Directory -Filter 'app-1.0.1-*')
            if ($dirs.Count -ne 1) { throw "Expected one installation, got $($dirs.Count)" }
            $exe = Join-Path $dirs[0].FullName 'Atra.exe'
            if (!(Test-Path -LiteralPath $exe)) { throw 'Atra.exe missing' }
            $atra = Start-Process -FilePath $exe -WorkingDirectory $dirs[0].FullName -PassThru
            $windowFound = $false
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              $atra.Refresh()
              if ($atra.HasExited) { throw "Packaged app exited early: $($atra.ExitCode)" }
              if ($atra.MainWindowTitle -like '*Atra*') { $windowFound = $true; break }
            }
            if (!$windowFound) { throw 'Atra window not observed on hosted Windows runner' }
            $second = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($second.ExitCode -ne 0) { throw "Second installation failed: $($second.ExitCode)" }
            $atra.Refresh()
            if ($atra.HasExited) { throw 'Installer stopped the running application' }
            $dirs = @(Get-ChildItem -LiteralPath $root -Directory -Filter 'app-1.0.1-*')
            if ($dirs.Count -ne 2) { throw "Expected two isolated installations, got $($dirs.Count)" }
            foreach ($dir in $dirs) { if (!(Test-Path -LiteralPath (Join-Path $dir.FullName 'Atra.exe'))) { throw 'Incomplete installation' } }
            $file.Dispose()
            $file = $null
            if ((Get-FileHash -LiteralPath $legacy).Hash -ne $original) { throw 'Locked legacy file changed' }
            Write-Host 'PASS: first install, running Atra, locked read-only legacy file, and isolated reinstall.'
          } finally {
            if ($null -ne $atra -and !$atra.HasExited) { Stop-Process -Id $atra.Id -Force }
            if ($null -ne $file) { $file.Dispose() }
          }
