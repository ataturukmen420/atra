name: Cloud Windows release verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloud-windows-check.yml'
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Download and verify released installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'AtraSetup.exe'
          curl.exe --fail --location --retry 3 --output $setup 'https://github.com/ataturukmen420/atra/releases/download/v1.0.1/AtraSetup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          if ($actual -ne '251aa5a20f4f723f6564d4f4ac31e183a7c3bb6f9b9b2246f2620d89ec65e8d4') { throw "Installer hash mismatch: $actual" }
          Write-Host 'Release installer SHA-256 verified.'
      - name: Test clean and locked-file installations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'atra-cloud-install'
          $data = Join-Path $env:RUNNER_TEMP 'atra-cloud-data'
          $setup = Join-Path $env:RUNNER_TEMP 'AtraSetup.exe'
          New-Item -ItemType Directory -Path $root,$data -Force | Out-Null
          '{"translation_engine":"google"}' | Set-Content -Encoding utf8 (Join-Path $data 'config.json')
          $env:ATRA_DATA_DIR = $data
          $legacy = Join-Path $root 'Atra.exe'
          [IO.File]::WriteAllText($legacy, 'locked legacy test file')
          (Get-Item -LiteralPath $legacy).IsReadOnly = $true
          $original = (Get-FileHash -LiteralPath $legacy).Hash
          $file = [IO.File]::Open($legacy, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::None)
          $atra = $null
          try {
            $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=$root")
            $first = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($first.ExitCode -ne 0) { throw "First installation failed: $($first.ExitCode)" }
            $dirs = @(Get-ChildItem -LiteralPath $root -Directory -Filter 'app-1.0.1-*')
            if ($dirs.Count -ne 1) { throw "Expected one installation, got $($dirs.Count)" }
            $exe = Join-Path $dirs[0].FullName 'Atra.exe'
            if (!(Test-Path -LiteralPath $exe)) { throw 'Atra.exe missing' }
            $atra = Start-Process -FilePath $exe -WorkingDirectory $dirs[0].FullName -PassThru
            $windowFound = $false
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              $atra.Refresh()
              if ($atra.HasExited) { throw "Packaged app exited early: $($atra.ExitCode)" }
              if ($atra.MainWindowTitle -like '*Atra*') { $windowFound = $true; break }
            }
            if (!$windowFound) { throw 'Atra window not observed on hosted Windows runner' }
            $second = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($second.ExitCode -ne 0) { throw "Second installation failed: $($second.ExitCode)" }
            $atra.Refresh()
            if ($atra.HasExited) { throw 'Installer stopped the running application' }
            $dirs = @(Get-ChildItem -LiteralPath $root -Directory -Filter 'app-1.0.1-*')
            if ($dirs.Count -ne 2) { throw "Expected two isolated installations, got $($dirs.Count)" }
            foreach ($dir in $dirs) { if (!(Test-Path -LiteralPath (Join-Path $dir.FullName 'Atra.exe'))) { throw 'Incomplete installation' } }
            $file.Dispose()
            $file = $null
            if ((Get-FileHash -LiteralPath $legacy).Hash -ne $original) { throw 'Locked legacy file changed' }
            Write-Host 'PASS: first install, running Atra, locked read-only legacy file, and isolated reinstall.'
          } finally {
            if ($null -ne $atra -and !$atra.HasExited) { Stop-Process -Id $atra.Id -Force }
            if ($null -ne $file) { $file.Dispose() }
          }
      - name: Verify offline model translation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install --disable-pip-version-check 'ctranslate2==4.8.4' 'sentencepiece==0.2.2'
          if ($LASTEXITCODE -ne 0) { throw 'Could not install translation test dependencies' }
          $root = Join-Path $env:RUNNER_TEMP 'atra-cloud-install'
          $app = Get-ChildItem -LiteralPath $root -Directory -Filter 'app-1.0.1-*' | Select-Object -First 1
          $env:ATRA_CLOUD_MODEL = Join-Path $app.FullName '_internal/models/opus-mt-en-tr-ct2'
          @'
          import os
          from pathlib import Path
          import ctranslate2
          import sentencepiece as spm
          model = Path(os.environ['ATRA_CLOUD_MODEL'])
          source = spm.SentencePieceProcessor(str(model / 'source.spm'))
          target = spm.SentencePieceProcessor(str(model / 'target.spm'))
          engine = ctranslate2.Translator(str(model), device='cpu', compute_type='int8', inter_threads=2, intra_threads=4)
          prompt = 'Welcome to the game.'
          tokens = source.encode(prompt, out_type=str) + ['</s>']
          result = engine.translate_batch([tokens], beam_size=2, max_decoding_length=128)
          translated = target.decode(result[0].hypotheses[0]).strip()
          assert translated and translated.lower() != prompt.lower(), translated
          print('Offline translation:', translated)
          '@ | py -3.11 -
          if ($LASTEXITCODE -ne 0) { throw 'Offline translation test failed' }
      - name: Verify portable package
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'Atra-Portable-Windows-x64.zip'
          curl.exe --fail --location --retry 3 --output $zip 'https://github.com/ataturukmen420/atra/releases/download/v1.0.1/Atra-Portable-Windows-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Portable download failed' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne '0d5ac8bce75641af0f54c5839e8dba38deebf30012f1b23f397e00107bfe115c') { throw 'Portable package hash mismatch' }
          $portable = Join-Path $env:RUNNER_TEMP 'atra-portable'
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $portable)
          $exe = Join-Path $portable 'Atra/Atra.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Portable Atra.exe missing' }
          $env:ATRA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'atra-portable-data'
          New-Item -ItemType Directory -Path $env:ATRA_DATA_DIR -Force | Out-Null
          '{"translation_engine":"google"}' | Set-Content -Encoding utf8 (Join-Path $env:ATRA_DATA_DIR 'config.json')
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $found = $false
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Portable app exited: $($process.ExitCode)" }
              if ($process.MainWindowTitle -like '*Atra*') { $found = $true; break }
            }
            if (!$found) { throw 'Portable Atra window not observed' }
            Write-Host 'Portable package extracted and opened successfully.'
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
